<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>eQSR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  :root{--bg:#0B1F3A;--card:#12294B;--line:#5C7597;--txt:#fff;--sub:#B6C4DA;--acc:#2DD4BF;--accT:#06232A;--err:#FF8A8A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans Thai',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .screen{display:none;position:fixed;inset:0;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .screen.on{display:flex}
  .pad{padding:0 24px}
  h1{margin:8px 0 4px;font-size:32px}
  .sub{color:var(--sub);font-size:16px;line-height:1.7}
  .small{font-size:13px;color:var(--sub);line-height:1.6;text-align:center}
  label{font-size:15px;color:#DCE5F2}
  input[type=text]{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;padding:0 16px;font:400 18px 'Noto Sans Thai',sans-serif;width:100%}
  button{font-family:'Noto Sans Thai',sans-serif;cursor:pointer}
  .btn{height:56px;border-radius:14px;border:0;background:var(--acc);color:var(--accT);font-weight:700;font-size:17px;width:100%}
  .btn:disabled{opacity:.6}
  .ghost{height:52px;border-radius:14px;border:1px solid var(--line);background:transparent;color:#fff;font-weight:600;font-size:16px;width:100%}
  .link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;padding:8px}
  .err{color:var(--err);font-size:14px;min-height:20px;text-align:center}
  .logo{width:84px;height:84px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:22px;font-weight:700;background:#fff0}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .blogo{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
  #lbtn{display:flex;align-items:center;justify-content:center;gap:10px}
  #scan{background:#05101F}
  .top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;position:relative;z-index:2}
  .pill{background:var(--card);border-radius:20px;padding:8px 14px;font-size:14px;color:#DCE5F2}
  .cam{flex:1;position:relative;overflow:hidden;background:#16202E;min-height:200px}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .frame{position:absolute;left:50%;top:50%;width:260px;height:260px;transform:translate(-50%,-50%)}
  .frame i{position:absolute;width:52px;height:52px;border:0 solid var(--acc)}
  .tl{left:0;top:0;border-left-width:5px;border-top-width:5px;border-radius:12px 0 0 0}
  .tr{right:0;top:0;border-right-width:5px;border-top-width:5px;border-radius:0 12px 0 0}
  .bl{left:0;bottom:0;border-left-width:5px;border-bottom-width:5px;border-radius:0 0 0 12px}
  .br{right:0;bottom:0;border-right-width:5px;border-bottom-width:5px;border-radius:0 0 12px 0}
  .laser{position:absolute;left:12px;right:12px;height:3px;background:var(--acc);opacity:.8;animation:sweep 2s ease-in-out infinite}
  @keyframes sweep{0%,100%{top:8%}50%{top:92%}}
  .bottom{padding:16px 24px 28px;display:flex;flex-direction:column;gap:12px;text-align:center}
  #status{font-size:17px;min-height:26px}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(120px + env(safe-area-inset-bottom));background:#fff;color:#0B1F3A;border-radius:12px;padding:12px 16px;font-size:15px;display:none;z-index:9;text-align:center}
  #view{background:#fff;color:#0B1F3A}
  .vtop{background:var(--bg);color:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center}
  .host{flex:1;min-width:0;background:var(--card);border-radius:10px;padding:10px 14px;font-size:14px;color:#DCE5F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbtn{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;text-decoration:none;white-space:nowrap;font-weight:600}
  .vbtn.acc{background:var(--acc);color:var(--accT);border-color:var(--acc)}
  #frame{flex:1;width:100%;border:0;background:#F4F7FB}
  #nt{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#F4F7FB}
  .vbot{padding:14px 24px 20px;background:#fff;border-top:1px solid #DCE5F2;display:flex;flex-direction:column;gap:6px}
  .hint{font-size:12px;color:#5B6B85;text-align:center}
  #login{align-items:center;justify-content:center;text-align:center;gap:16px}
</style>
</head>
<body>

<!-- 1) Login -->
<div id="login" class="screen on">
  <div class="pad" style="width:100%;display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;text-align:left">
    <div class="logo" id="logo"><img id="logoimg" alt="SNE" referrerpolicy="no-referrer"></div>
    <div><h1>eQSR</h1><div class="sub">Easy QR Scan &amp; Read</div></div>
    <div style="flex:1;max-height:60px"></div>
    <label for="un">ชื่อผู้ใช้ (Username)</label>
    <input id="un" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" maxlength="100">
    <div id="lerr" class="err"></div>
    <button id="lbtn" class="btn"><img id="lbtnlogo" class="blogo" alt="" referrerpolicy="no-referrer"><span id="lbtxt">เข้าสู่ระบบและเปิดกล้อง</span></button>
    <div class="small">เมื่อเข้าสู่ระบบ กล้องจะเปิดอัตโนมัติ</div>
    <div class="small">เวอร์ชัน <span id="ver2"></span></div>
  </div>
</div>

<!-- 2) Scanner -->
<div id="scan" class="screen">
  <div class="top"><div style="font-weight:700;font-size:18px">eQSR <span id="ver" style="font-weight:400;font-size:12px"></span></div><div class="pill" id="cnt">สแกนแล้ว 0 จุด</div></div>
  <div class="cam">
    <video id="v" muted playsinline autoplay></video>
    <div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><div class="laser"></div></div>
  </div>
  <div class="bottom">
    <div id="status">กำลังเปิดกล้อง…</div>
    <div id="who" class="small"></div>
    <div id="dbg" class="small" style="display:none"></div>
    <button id="retry" class="btn" style="display:none">เปิดกล้องอีกครั้ง</button>
    <button id="pic" class="link" style="display:none">เปิดกล้องไม่ได้? ถ่ายรูป/เลือกรูป QR แทน</button>
    <input id="file" type="file" accept="image/*" capture="environment" style="display:none">
    <button id="lo" class="ghost">ออกจากระบบ</button>
  </div>
  <div id="toast" class="toast"></div>
</div>

<!-- 3) Destination page -->
<div id="view" class="screen">
  <div class="vtop">
    <button id="back" class="vbtn acc">&#8592; กลับไปกล้อง</button>
    <div class="host" id="host"></div>
    <a id="newtab" class="vbtn" target="_blank" rel="noopener" href="#">แท็บใหม่</a>
  </div>
  <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
  <div id="nt"><div style="font-size:20px;font-weight:700">เปิดหน้าปลายทางแล้ว</div><div class="hint" style="font-size:14px">ถ้าหน้าไม่เปิดเอง กดปุ่มด้านล่าง</div><a id="ntlink" class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;max-width:320px" target="_blank" rel="noopener" href="#">เปิดหน้า</a></div>
  <div class="vbot">
    <button id="done" class="btn">เสร็จสิ้น กลับไปสแกนจุดถัดไป</button>
    <div class="hint" id="vhint">ถ้าหน้าไม่แสดงในกรอบ ให้กด "แท็บใหม่" แล้วกลับมากดปุ่มนี้</div>
  </div>
</div>

<script>
// ================= ค่าที่ต้องตั้ง / ปรับได้ =================
var API_URL = 'https://script.google.com/macros/s/AKfycbzk-Tx498gUgOQmXS5c3wp1uF1rsklwqBuaQTKohOsHSkANqaB_2cTLIVrIg9JV1w/exec';
var LOGO_ID = '1HPH_3fHdGoluWeignOFuwiSUeBOCZPGE';   // ID รูปโลโก้จาก Google Drive (ไฟล์ต้องแชร์แบบ Anyone with the link)
var LOGO_URL = 'https://drive.google.com/thumbnail?id=' + LOGO_ID + '&sz=w256';
var OPEN_MODE = 'embed';            // 'embed' แสดงในกรอบพร้อมปุ่มกลับกล้อง (แนะนำ) | 'newtab' เปิดแท็บใหม่ | 'same' เปิดแทนหน้านี้
var KEEPALIVE_MS = 120000;          // ต่ออายุ session กับเซิร์ฟเวอร์ทุก 2 นาที (ไม่มีการนับถอยหลัง/ไม่ logout เอง)
var SCAN_INTERVAL_MS = 100;
var SAME_QR_COOLDOWN_MS = 3000;
var API_TIMEOUT_MS = 30000;
var BD_TIMEOUT_MS = 400;

// ================= สถานะ =================
var S = { token: null, stream: null, raf: 0, lastTick: 0, busy: false, lastText: '', lastAt: 0,
          keepId: 0, dbgId: 0, cid: null, frames: 0, pass: 0, bdBad: false, lastErr: '', count: 0 };

function $(id) { return document.getElementById(id); }
function show(id) { ['login', 'scan', 'view'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2500);
}
function setCount() { $('cnt').textContent = 'สแกนแล้ว ' + S.count + ' จุด'; }

async function api(body) {
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, API_TIMEOUT_MS);
  try {
    var res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal });
    var j = await res.json();
    if (!j || !j.ok) throw new Error((j && j.error) || 'api_error');
    return j.data;
  } finally { clearTimeout(t); }
}
function getClientId() {
  if (S.cid) return S.cid;
  try { S.cid = localStorage.getItem('eqsr_cid'); } catch (e) {}
  if (!S.cid) {
    S.cid = 'c' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { localStorage.setItem('eqsr_cid', S.cid); } catch (e) {}
  }
  return S.cid;
}
function saveSession(name) { try { sessionStorage.setItem('eqsr_s', JSON.stringify({ token: S.token, name: name || '', count: S.count })); } catch (e) {} }
function clearSession() { try { sessionStorage.removeItem('eqsr_s'); } catch (e) {} }

// ---- ต่ออายุ session เบื้องหลัง (แทนการ logout อัตโนมัติ) ----
function startKeepAlive() { clearInterval(S.keepId); S.keepId = setInterval(keepAlive, KEEPALIVE_MS); }
async function keepAlive() {
  if (!S.token) return;
  try {
    var r = await api({ action: 'validate', token: S.token });
    if (!r || !r.valid) toLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
  } catch (e) { /* เครือข่ายสะดุด ลองใหม่รอบหน้า */ }
}

// ================= Login =================
async function doLogin() {
  var u = $('un').value.trim();
  $('lerr').textContent = '';
  if (!u) { $('lerr').textContent = 'กรุณากรอกชื่อผู้ใช้'; return; }
  $('lbtn').disabled = true; $('lbtxt').textContent = 'กำลังตรวจสอบ…';
  try {
    var r = await api({ action: 'login', username: u, clientId: getClientId(), userAgent: navigator.userAgent });
    if (!r || !r.success) { $('lerr').textContent = (r && r.message) || 'เข้าสู่ระบบไม่สำเร็จ'; return; }
    S.token = r.token; S.count = 0;
    $('who').textContent = r.fullName ? ('ผู้ใช้: ' + r.fullName) : '';
    saveSession(r.fullName); $('un').value = '';
    enterScanner();
  } catch (e) {
    $('lerr').textContent = 'เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่';
  } finally {
    $('lbtn').disabled = false; $('lbtxt').textContent = 'เข้าสู่ระบบและเปิดกล้อง';
  }
}
function toLogin(msg) {
  stopScanner(); clearInterval(S.keepId); clearInterval(S.dbgId);
  $('frame').src = 'about:blank'; S.token = null; clearSession();
  $('lerr').textContent = msg || '';
  show('login');
}
async function resume() {
  var s = null; try { s = JSON.parse(sessionStorage.getItem('eqsr_s') || 'null'); } catch (e) {}
  if (!s || !s.token) return;
  try {
    var r = await api({ action: 'validate', token: s.token });
    if (r && r.valid) {
      S.token = s.token; S.count = s.count || 0;
      $('who').textContent = (r.fullName || s.name) ? ('ผู้ใช้: ' + (r.fullName || s.name)) : '';
      enterScanner(); return;
    }
  } catch (e) {}
  clearSession();
}
async function manualLogout() {
  var t = S.token;
  toLogin('');
  if (t) { try { await api({ action: 'logout', token: t, reason: 'LOGOUT' }); } catch (e) {} }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  if (S.token) keepAlive();
  if ($('scan').classList.contains('on') && !S.stream && !S.busy && $('pic').style.display === 'none') startCamera();
});
window.addEventListener('pageshow', function (e) { if (e.persisted) resume(); });

// ================= Scanner =================
function enterScanner() {
  show('scan'); setCount(); startKeepAlive();
  clearInterval(S.dbgId); S.dbgId = setInterval(updateDbg, 1000);
  S.busy = false; S.lastText = '';
  startCamera();
}
function camErrText(e) {
  var n = (e && e.name) || 'Error';
  var inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger|Messenger/i.test(navigator.userAgent || '');
  var msg;
  if (!window.isSecureContext) msg = 'หน้านี้ไม่ได้เปิดผ่าน HTTPS';
  else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    msg = inApp ? 'เบราว์เซอร์ในแอป (LINE/Facebook ฯลฯ) ไม่รองรับกล้อง กรุณาเปิดลิงก์ด้วย Chrome หรือ Safari'
                : 'เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง';
  else if (n === 'NotAllowedError' || n === 'SecurityError') msg = 'ยังไม่ได้รับอนุญาตใช้กล้อง กรุณาอนุญาตกล้องให้เว็บนี้ในการตั้งค่าเบราว์เซอร์ แล้วกดลองอีกครั้ง';
  else if (n === 'NotFoundError') msg = 'ไม่พบกล้องในเครื่อง';
  else if (n === 'NotReadableError' || n === 'AbortError') msg = 'กล้องถูกใช้งานโดยแอปอื่นอยู่ กรุณาปิดแอปที่ใช้กล้อง แล้วกดลองอีกครั้ง';
  else msg = 'เปิดกล้องไม่ได้';
  return msg + ' (' + n + ')';
}
async function startCamera() {
  stopScanner();
  $('status').textContent = 'กำลังเปิดกล้อง…';
  $('pic').style.display = 'none'; $('retry').style.display = 'none';
  var tries = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: { facingMode: 'environment' }, audio: false },
    { video: true, audio: false }
  ];
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    var lastErr = null;
    for (var i = 0; i < tries.length && !S.stream; i++) {
      try { S.stream = await navigator.mediaDevices.getUserMedia(tries[i]); }
      catch (e) { lastErr = e; if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break; }
    }
    if (!S.stream) throw lastErr || new Error('nocam');
    try {
      var trk = S.stream.getVideoTracks()[0];
      var caps = trk.getCapabilities ? trk.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) await trk.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) {}
    var v = $('v'); v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = S.stream; await v.play();
    $('status').textContent = 'วาง QR Code ให้อยู่ในกรอบ';
    S.lastTick = 0; S.raf = requestAnimationFrame(loop);
  } catch (e) {
    stopScanner();
    $('status').textContent = camErrText(e);
    $('retry').style.display = 'block';
    $('pic').className = 'ghost'; $('pic').textContent = 'ถ่ายรูป QR Code แทน'; $('pic').style.display = 'block';
  }
}
function stopScanner() {
  cancelAnimationFrame(S.raf);
  if (S.stream) { S.stream.getTracks().forEach(function (t) { t.stop(); }); S.stream = null; }
  var v = $('v'); try { v.pause(); } catch (e) {} v.srcObject = null;
}

var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
var BD = null; try { if ('BarcodeDetector' in window) BD = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { BD = null; }
var decoding = false, decStart = 0;
var DEBUG = /[?&]debug/.test(location.search);
if (typeof jsQR === 'undefined') {
  var _s = document.createElement('script'); _s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; document.head.appendChild(_s);
}
function updateDbg() {
  if (!DEBUG || !$('scan').classList.contains('on')) return;
  var d = $('dbg'), v = $('v'); d.style.display = 'block';
  d.textContent = v.videoWidth + 'x' + v.videoHeight + ' | frames:' + S.frames + ' | jsQR:' + (typeof jsQR !== 'undefined') + ' | BD:' + !!BD + (S.bdBad ? '(off)' : '') + (S.lastErr ? ' | err:' + S.lastErr : '');
}
function withTimeout(p, ms) {
  return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]);
}
async function decodeVideo(v) {
  if (BD && !S.bdBad) {
    try {
      var r = await withTimeout(BD.detect(v), BD_TIMEOUT_MS);
      if (r && r.length && r[0].rawValue) return r[0].rawValue;
    } catch (e) {
      S.lastErr = 'BD:' + (e && (e.name || e.message));
      if (e && e.message === 'timeout') S.bdBad = true;
    }
  }
  if (typeof jsQR === 'undefined') { S.lastErr = 'jsQR not loaded'; return null; }
  var vw = v.videoWidth, vh = v.videoHeight, w, h;
  S.pass = (S.pass + 1) % 2;
  if (S.pass === 0) {
    var sc = Math.min(1, 900 / Math.max(vw, vh));
    w = Math.round(vw * sc); h = Math.round(vh * sc);
    cv.width = w; cv.height = h;
    cx.drawImage(v, 0, 0, w, h);
  } else {
    var side = Math.floor(Math.min(vw, vh) * 0.6), out = Math.min(side, 800);
    var sx = Math.floor((vw - side) / 2), sy = Math.floor((vh - side) / 2);
    w = out; h = out; cv.width = w; cv.height = h;
    cx.drawImage(v, sx, sy, side, side, 0, 0, w, h);
  }
  var img = cx.getImageData(0, 0, w, h);
  var c = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
  return (c && c.data) ? c.data : null;
}
function loop(ts) {
  S.raf = requestAnimationFrame(loop);
  if (decoding && Date.now() - decStart > 3000) decoding = false;
  if (S.busy || decoding || ts - S.lastTick < SCAN_INTERVAL_MS) return;
  S.lastTick = ts;
  var v = $('v'); if (!v.videoWidth || v.readyState < 2) return;
  decoding = true; decStart = Date.now();
  decodeVideo(v)
    .then(function (text) { S.frames++; if (text) handleText(text); })
    .catch(function (e) { S.lastErr = (e && (e.name || e.message)) || 'decode'; })
    .then(function () { decoding = false; });
}
async function handleText(text) {
  var now = Date.now();
  if (S.busy) return;
  if (text === S.lastText && now - S.lastAt < SAME_QR_COOLDOWN_MS) return;
  S.lastText = text; S.lastAt = now;
  if (!/^https?:\/\//i.test(text)) { toast('QR นี้ไม่ใช่ลิงก์เว็บ (http/https): ' + String(text).slice(0, 40)); return; }
  S.busy = true; $('status').textContent = 'กำลังเปิดหน้า…';
  if (navigator.vibrate) navigator.vibrate(60);
  try {
    var r = await api({ action: 'scan', token: S.token, url: text });
    if (r && r.expired) { toLogin(r.message || 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); return; }
    if (!r || !r.success) { toast((r && r.message) || 'สแกนไม่สำเร็จ'); S.busy = false; $('status').textContent = 'วาง QR Code ให้อยู่ในกรอบ'; return; }
    S.count++; setCount();
    openPage(r.url);
  } catch (e) {
    toast('เชื่อมต่อระบบไม่ได้ ลองสแกนใหม่'); S.busy = false; $('status').textContent = 'วาง QR Code ให้อยู่ในกรอบ';
  }
}

// ถ่าย/เลือกรูป QR (สำรองกรณีเปิดกล้องสดไม่ได้)
$('pic').onclick = function () { $('file').click(); };
$('file').onchange = function (ev) {
  var f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f) return;
  if (typeof jsQR === 'undefined') { toast('ไลบรารีอ่าน QR ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง'); return; }
  var url = URL.createObjectURL(f), im = new Image();
  im.onload = function () {
    var sc = Math.min(1, 1000 / Math.max(im.width, im.height));
    cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
    cx.drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    var d = cx.getImageData(0, 0, cv.width, cv.height), c = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
    if (c && c.data) { S.lastText = ''; handleText(c.data); } else toast('ไม่พบ QR ในรูป ลองถ่ายใหม่ให้ชัดขึ้น');
  };
  im.onerror = function () { toast('อ่านรูปไม่ได้'); };
  im.src = url;
};

// ================= หน้าปลายทาง =================
function openPage(url) {
  stopScanner();
  if (OPEN_MODE === 'same') { saveSession(); location.href = url; return; }
  var host = (url.match(/^https?:\/\/([^\/?#]+)/i) || [])[1] || '';
  $('host').textContent = host; $('newtab').href = url; $('ntlink').href = url;
  show('view');
  if (OPEN_MODE === 'newtab') {
    $('frame').style.display = 'none'; $('nt').style.display = 'flex'; $('vhint').style.display = 'none';
    try { window.open(url, '_blank'); } catch (e) {}
  } else {
    $('nt').style.display = 'none'; $('frame').style.display = 'block'; $('vhint').style.display = 'block';
    $('frame').src = url;
  }
}
// กลับไปกล้องเพื่อสแกนจุดถัดไป
function backToCamera() {
  $('frame').src = 'about:blank';
  saveSession();
  enterScanner();
}

// ================= ผูกปุ่ม / เริ่มต้น =================
$('lbtn').onclick = doLogin;
$('un').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
$('lo').onclick = manualLogout;
$('retry').onclick = startCamera;
$('done').onclick = backToCamera;
$('back').onclick = backToCamera;
(function () {
  var li = $('logoimg'), bi = $('lbtnlogo');
  li.onerror = function () { li.style.display = 'none'; $('logo').textContent = 'SNE'; };   // โหลดรูปไม่ได้ -> แสดงตัวอักษรแทน
  bi.onerror = function () { bi.style.display = 'none'; };
  li.src = LOGO_URL; bi.src = LOGO_URL;
  var d = new Date(document.lastModified);
  var t = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  $('ver').textContent = t; $('ver2').textContent = t;
})();
resume();
</script>

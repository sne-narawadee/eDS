<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eQSR - ทดสอบ API</title>
<style>
  body{font-family:system-ui,'Noto Sans Thai',sans-serif;margin:0;padding:16px;background:#0B1F3A;color:#fff}
  h1{font-size:20px;margin:0 0 12px}
  label{display:block;font-size:14px;color:#B6C4DA;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;height:44px;border-radius:10px;border:1px solid #5C7597;background:#12294B;color:#fff;padding:0 12px;font-size:15px}
  button{height:44px;border-radius:10px;border:0;background:#2DD4BF;color:#06232A;font-weight:700;font-size:15px;padding:0 16px;margin:12px 8px 0 0}
  pre{background:#05101F;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-all;min-height:120px}
</style>
</head>
<body>
<h1>eQSR: ทดสอบการเรียก Apps Script API</h1>

<label for="url">ลิงก์ Web app ของ Apps Script (ลงท้ายด้วย /exec)</label>
<input id="url" type="text" placeholder="https://script.google.com/macros/s/.../exec">

<label for="un">username สำหรับทดสอบ login (ต้องเป็นผู้ใช้ที่ sync มาแล้ว)</label>
<input id="un" type="text" value="eqr1" autocapitalize="none">

<button id="b1">1) ทดสอบ ping</button>
<button id="b2">2) ทดสอบ login → validate → logout</button>

<pre id="out">ผลลัพธ์จะแสดงที่นี่</pre>

<script>
var out = document.getElementById('out');
function log(s) { out.textContent += '\n' + s; }

// ส่งแบบ simple request: ไม่ตั้ง Content-Type (เบราว์เซอร์จะใช้ text/plain) เพื่อไม่ให้มี preflight
async function api(body) {
  var url = document.getElementById('url').value.trim();
  var t0 = performance.now();
  var res = await fetch(url, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
  var text = await res.text();
  var ms = Math.round(performance.now() - t0);
  var json;
  try { json = JSON.parse(text); } catch (e) { throw new Error('ตอบกลับไม่ใช่ JSON (HTTP ' + res.status + '): ' + text.substring(0, 120)); }
  return { json: json, ms: ms };
}

document.getElementById('b1').onclick = async function () {
  out.textContent = 'กำลังเรียก ping…';
  try {
    var r = await api({ action: 'ping' });
    log('OK (' + r.ms + ' ms): ' + JSON.stringify(r.json));
  } catch (e) { log('ล้มเหลว: ' + e.message + '\n(ถ้าเป็น "Failed to fetch" แปลว่าถูกบล็อกด้วย CORS หรือลิงก์ไม่ถูกต้อง)'); }
};

document.getElementById('b2').onclick = async function () {
  out.textContent = 'กำลังทดสอบ login…';
  try {
    var cid = 'cors-test';
    var l = await api({ action: 'login', username: document.getElementById('un').value, clientId: cid, userAgent: navigator.userAgent });
    log('login (' + l.ms + ' ms): ' + JSON.stringify(l.json).replace(/"token":"[^"]+"/, '"token":"…"'));
    var tok = l.json && l.json.data && l.json.data.token;
    if (!tok) { log('ไม่ได้ token หยุดทดสอบ'); return; }
    var v1 = await api({ action: 'validate', token: tok });
    log('validate: ' + JSON.stringify(v1.json));
    var lo = await api({ action: 'logout', token: tok, reason: 'LOGOUT' });
    log('logout: ' + JSON.stringify(lo.json));
    var v2 = await api({ action: 'validate', token: tok });
    log('validate หลัง logout: ' + JSON.stringify(v2.json));
  } catch (e) { log('ล้มเหลว: ' + e.message); }
};
</script>
</body>
</html>
